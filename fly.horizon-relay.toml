app = "twilio-horizon-preso-relay"
primary_region = "syd"

[build]
  dockerfile = "packages/conversation-relay/Dockerfile"

[env]
  CONVERSATION_RELAY_PORT = "3003"

# Twilio holds one WebSocket open for the length of a call, so the machine must
# not be stopped between calls — a cold start is dead air on a ringing phone.
[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
